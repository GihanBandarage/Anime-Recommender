<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#121312" />
    <title>Your next watch — Next Arc</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="results">
    <header class="site-header wrap">
      <a class="brand" href="/" aria-label="Next Arc home"
        ><span class="brand-mark" aria-hidden="true">↗</span> NEXT ARC<span
          class="brand-dot"
          >.</span
        ></a
      >
      <a class="header-link" href="/"
        >Try another profile <span aria-hidden="true">↗</span></a
      >
    </header>
    <main class="wrap results-main">
      <div class="results-heading">
        <p class="eyebrow">THE NEXT CHAPTER</p>
        <h1>Your taste. <span class="serif">New stories.</span></h1>
        <p class="intro" id="profile-summary">Finding your next watch…</p>
      </div>
      <section
        class="status-panel"
        id="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="spinner" aria-hidden="true"></span>
        <h2 id="status-title">Getting to know your taste</h2>
        <p id="status-message">
          Reading your MAL list and checking for unseen matches. This can take a
          little while.
        </p>
        <button id="retry" class="primary-button" type="button" hidden>
          Try again ↗
        </button>
      </section>
      <div id="result-info" class="result-info" hidden>
        <span id="result-count"></span><span id="method"></span>
      </div>
      <p id="notice" class="notice" hidden></p>
      <ol
        id="recommendations"
        class="recommendations"
        aria-label="Recommended anime"
        aria-busy="true"
      ></ol>
    </main>
    <footer class="site-footer wrap">
      <span>Your next favorite is out there.</span
      ><span>Independent project · Data from MyAnimeList</span>
    </footer>
  </body>
</html>
